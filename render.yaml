# Blueprint do PILOTO no Render: frontend Next.js e backend NestJS como dois
# web services, publicados só manualmente, a partir de um commit validado.
#
# Este arquivo NÃO cria nada sozinho. Nada aqui é aplicado até alguém criar
# o Blueprint no painel do Render, e os dois campos marcados PENDENTE abaixo
# fazem a validação do Blueprint falhar até serem decididos de propósito.
#
# Os nomes `agenda-cloud-piloto-*` são exclusivos deste sistema. A mesma
# conta do Render já hospeda outro sistema (com Blueprint, serviços, banco e
# variáveis próprios): este Blueprint nunca declara, referencia nem reutiliza
# nada dele, e nenhum grupo de variáveis (envVarGroups) é usado.
#
# Fluxo na mesma origem (endereços gratuitos `*.onrender.com`): o navegador
# só fala com o serviço web; o Next.js encaminha `/agenda_api/*` à API pela
# internet pública (um serviço gratuito não recebe tráfego da rede privada).
#
# Nunca coloque aqui credencial, URL de banco ou domínio real: tudo que é
# segredo ou ainda não existe fica com `sync: false` e é digitado no painel.
# Roteiro completo, variáveis e verificações:
# docs/runbooks/publicacao-piloto-render.md

services:
  # API NestJS (backend/). Banco: Neon EXCLUSIVO do piloto, nunca o production
  # existente nem o banco de outro sistema da conta.
  - type: web
    name: agenda-cloud-piloto-api
    runtime: node
    # Sem isto o Render usa a branch padrão do repositório (main), que não
    # recebe este código. O deploy manual escolhe um commit DESTA branch.
    branch: integration/nestjs-typeorm-frontend
    # PENDENTE: região e plano são decisões de custo/latência, não do código.
    # O Render não muda a região de um serviço depois de criado. Trocar os
    # dois valores abaixo antes de criar o Blueprint (ver runbook, seção 1).
    region: PENDENTE_REGIAO
    plan: PENDENTE_PLANO
    rootDir: backend
    # `--include=dev`: o build usa @nestjs/cli e TypeScript (devDependencies).
    # NODE_ENV=production vale também no build quando definido abaixo, e sem
    # isto o `npm ci` pularia essas dependências.
    buildCommand: npm ci --include=dev && npm run build
    # Mesmo comando do CI (playwright.config.ts). Escuta em HOST:PORT; o PORT
    # vem do Render (padrão 10000).
    startCommand: node dist/main.js
    healthCheckPath: /
    # Rate limit em memória (express-rate-limit MemoryStore): só vale com UMA
    # instância. Nunca escalar sem trocar o store.
    numInstances: 1
    autoDeployTrigger: "off"
    # Migrations NUNCA rodam no deploy: o banco do piloto é inicializado à mão,
    # com conferência do destino antes (ver runbook, seção 6).
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Só para chamadas que NÃO vêm do proxy do frontend. Fica `socket` até
      # a hospedagem confirmar o cabeçalho do IP do cliente (runbook, seção
      # 5). Nunca trocar por suposição.
      - key: CLIENT_IP_SOURCE
        value: socket
      # Segredo compartilhado com o proxy do frontend: só com ele a API aceita
      # o IP do cliente informado pelo proxy. Gerado pelo próprio Render na
      # criação do Blueprint; ninguém digita nem vê o valor.
      - key: API_PROXY_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Origem pública do serviço web (`https://<web>.onrender.com`), exigida
      # em HTTPS pela validação de ambiente da API.
      - key: FRONTEND_URL
        sync: false

  # Frontend Next.js (raiz do repositório).
  - type: web
    name: agenda-cloud-piloto-web
    runtime: node
    # Sem isto o Render usa a branch padrão do repositório (main), que não
    # recebe este código. O deploy manual escolhe um commit DESTA branch.
    branch: integration/nestjs-typeorm-frontend
    region: PENDENTE_REGIAO
    plan: PENDENTE_PLANO
    buildCommand: npm ci --include=dev && npm run build
    # `next start` usa o PORT do ambiente. `-H 0.0.0.0` explícito: medido
    # localmente, o padrão escutou em `::`, e o Render exige 0.0.0.0.
    startCommand: npm run start -- -H 0.0.0.0
    healthCheckPath: /login
    numInstances: 1
    autoDeployTrigger: "off"
    envVars:
      # Embutido no JavaScript durante o BUILD (nunca lido em runtime). Modo
      # mesma origem: o navegador chama `/agenda_api/*` no próprio frontend
      # (ver src/lib/publicacao/api-url.ts e src/lib/api/proxy.ts).
      - key: NEXT_PUBLIC_API_URL
        value: /agenda_api
      # Destino FIXO do proxy: a origem HTTPS pública da API
      # (`https://<api>.onrender.com`). Lido só no servidor; o build também
      # recusa valor ausente ou não-HTTPS.
      - key: API_PROXY_TARGET
        sync: false
      - key: API_PROXY_SECRET
        fromService:
          type: web
          name: agenda-cloud-piloto-api
          envVarKey: API_PROXY_SECRET
      # De onde o proxy tira o IP do cliente para repassar à API. Mesma
      # pendência da API: fica `socket` (nenhum IP repassado) até a
      # confirmação da seção 5 do runbook.
      - key: CLIENT_IP_SOURCE
        value: socket
