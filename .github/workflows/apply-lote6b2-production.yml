name: "Apply Lote 6B.2 — guarded production migration"

# Só disparo manual — NUNCA em push ou pull_request. Ver
# docs/runbooks/migrations-production.md para como disparar e o que cada
# guarda faz.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite exatamente APLICAR_LOTE_6B2_PRODUCTION para confirmar'
        required: true
        type: string

# Só um job por vez, nunca dois em paralelo (evita duas migrations correndo
# ao mesmo tempo contra o mesmo banco). `cancel-in-progress: false` — nunca
# cancela uma execução já em andamento contra production; uma nova tentativa
# fica enfileirada, nunca substitui uma que já pode estar no meio da escrita.
concurrency:
  group: apply-lote6b2-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply guarded migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      # Nunca interpola ${{ }} direto dentro do bloco `run:` — valor passa por
      # variável de ambiente intermediária primeiro. `github.ref_name` e
      # `inputs.confirmation` são texto vindo de fora do repositório (o
      # segundo é digitado livremente por quem dispara); interpolar qualquer
      # um dos dois direto na string do shell permite escapar aspas e injetar
      # comando (ex.: digitar `"; comando_malicioso; echo "` no campo
      # confirmation). Usar `$VAR` depois de um `env:` não sofre desse
      # problema — o shell recebe o valor já como argumento, nunca como parte
      # do script.
      - name: Verify branch
        env:
          CURRENT_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$CURRENT_REF_NAME" != "integration/nestjs-typeorm-frontend" ]; then
            echo "REFUSED: workflow only runs from integration/nestjs-typeorm-frontend"
            exit 1
          fi

      - name: Verify confirmation phrase
        env:
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION_INPUT" != "APLICAR_LOTE_6B2_PRODUCTION" ]; then
            echo "REFUSED: confirmation phrase did not match"
            exit 1
          fi

      # SHA completo (não tag móvel `@v5`) — cada SHA abaixo é o commit
      # exato por trás da tag oficial no momento da auditoria (conferido via
      # `gh api repos/actions/<repo>/tags` contra o repositório oficial
      # `actions/*`). `ref: ${{ github.sha }}` faz checkout do commit exato
      # que o disparo do workflow apontava — nunca a ponta móvel da branch,
      # que poderia já ter avançado entre o disparo e este passo. Não há
      # input de ref: só a branch selecionada na UI do workflow_dispatch
      # (já validada acima) decide o que roda; nunca PR, fork ou input livre.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # `--ignore-scripts` avaliado e descartado: `argon2` (usado no hash de
      # senha do backend) tem um script `install` (`node-gyp-build`) que
      # busca/prepara o binário nativo da lib — sem rodar esse script o
      # pacote fica sem o binário e o backend quebra ao importar `argon2`.
      # `package-lock.json` é obrigatório e está versionado (`npm ci` falha
      # sem ele) — nenhum lockfile é gerado/alterado neste passo.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Nunca imprime segredo nenhum: `apply-lote6b2-production.ts` sanitiza
      # toda a saída (ver backend/scripts/lib/sanitize.ts) antes de qualquer
      # `console.log`. Todos os cinco secrets vêm só do GitHub Environment
      # `production` (nunca de `backend/.env`, que nem existe neste runner).
      - name: Run guarded production migration
        working-directory: backend
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          L6B2_PRODUCTION_DIRECT_URL: ${{ secrets.L6B2_PRODUCTION_DIRECT_URL }}
          L6B2_BACKUP_DIRECT_URL: ${{ secrets.L6B2_BACKUP_DIRECT_URL }}
          L6B2_PRODUCTION_ENDPOINT_ID: ${{ secrets.L6B2_PRODUCTION_ENDPOINT_ID }}
          L6B2_BACKUP_ENDPOINT_ID: ${{ secrets.L6B2_BACKUP_ENDPOINT_ID }}
          L6B2_VALIDATION_ENDPOINT_ID: ${{ secrets.L6B2_VALIDATION_ENDPOINT_ID }}
          L6B2_BACKUP_BRANCH_NAME: ${{ vars.L6B2_BACKUP_BRANCH_NAME }}
        run: npm run migrate:production:guarded
