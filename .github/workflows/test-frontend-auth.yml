      # reais, situação das notificações deste aparelho sem pedir permissão,
      # nenhuma consulta de solicitações a mais, Sair). Capturas em 360, 390
      # e 1280 px nos dois temas. Chaves VAPID só deste processo, para o
      # servidor responder "push ligado"; nada é enviado.
      - name: Run real browser flows (light/dark appearance, account menu notifications)
        id: browser_aparencia
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
