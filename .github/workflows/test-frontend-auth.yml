name: "Test — frontend auth + gestão real de serviços (PostgreSQL descartável)"

# Só PR para a integration (e disparo manual pra depuração) — nunca
# workflow_dispatch de production, nunca Environment `production`, nunca
# secret nenhum. O PostgreSQL usado aqui é sempre um container descartável
# criado dentro deste job, com credenciais fictícias, nunca Neon nem
# qualquer banco existente. Mesma disciplina de
# test-migration-lote6b2.yml (Lote 6B.10).
on:
  pull_request:
    branches:
      - integration/nestjs-typeorm-frontend
    paths:
      - "src/**"
      - "tests/browser/**"
      - "playwright.config.ts"
      - "playwright.proxy.config.ts"
      - "playwright.relogio-de-teste.config.ts"
      - "package.json"
      - "package-lock.json"
      - "backend/src/**"
      - "backend/test/**"
      - "backend/package.json"
      - "backend/vitest.config.db-e2e.ts"
      - ".github/workflows/test-frontend-auth.yml"
  workflow_dispatch: {}

concurrency:
  group: test-frontend-auth-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: auth real e serviços reais (navegador + API) contra PostgreSQL descartável
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Falha rápida antes de gastar tempo com Postgres/Playwright.
      - name: Frontend unit tests
        run: npm run test

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typed lint
        run: npm run lint:types

      # Backend: unidade (política de acesso, DTOs, isolamento) e E2E HTTP das
      # rotas. Ambos sem banco — a parte que precisa de Postgres real roda
      # depois, no passo `test:db-e2e`.
      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend unit tests
        working-directory: backend
        run: npm run test

      - name: Backend HTTP e2e tests
        working-directory: backend
        run: npm run test:e2e

      # Mesmo container/receita de test-migration-lote6b2.yml: certificado
      # self-signed gerado DENTRO do container (evita descompasso de
      # UID/permissão entre host e container do bind mount), TLS ligado só
      # depois de subir (`ssl` exige reinício do postmaster).
      # `rejectUnauthorized: true` do driver Node nunca é enfraquecido — o
      # certificado é confiado via `NODE_EXTRA_CA_CERTS`, nunca via flag do
      # driver.
      - name: Start disposable PostgreSQL container
        run: |
          docker run -d --name frontend-auth-e2e-postgres \
            -e POSTGRES_USER=disposable_user \
            -e POSTGRES_PASSWORD=disposable_pass \
            -e POSTGRES_DB=disposable_db \
            -p 55433:5432 \
            postgres:17

          for i in $(seq 1 30); do
            if docker exec frontend-auth-e2e-postgres pg_isready -U disposable_user >/dev/null 2>&1; then
              echo "postgres pronto (sem TLS ainda)"
              break
            fi
            sleep 1
          done

      - name: Enable TLS on the disposable PostgreSQL (self-signed, test-only cert generated inside the container)
        run: |
          docker exec -u root frontend-auth-e2e-postgres bash -c '
            set -e
            command -v openssl >/dev/null || (apt-get update && apt-get install -y --no-install-recommends openssl)
            cd /var/lib/postgresql/data
            openssl req -new -x509 -days 1 -nodes -subj "/CN=localhost" -out server.crt -keyout server.key
            chown postgres:postgres server.crt server.key
            chmod 600 server.key
            chmod 644 server.crt
          '
          docker exec -u postgres frontend-auth-e2e-postgres psql -U disposable_user -d disposable_db -c "ALTER SYSTEM SET ssl = on;"
          docker exec -u postgres frontend-auth-e2e-postgres psql -U disposable_user -d disposable_db -c "ALTER SYSTEM SET ssl_cert_file = 'server.crt';"
          docker exec -u postgres frontend-auth-e2e-postgres psql -U disposable_user -d disposable_db -c "ALTER SYSTEM SET ssl_key_file = 'server.key';"
          docker restart frontend-auth-e2e-postgres

          for i in $(seq 1 30); do
            if docker exec frontend-auth-e2e-postgres pg_isready -U disposable_user >/dev/null 2>&1; then
              echo "postgres pronto (TLS ligado)"
              break
            fi
            sleep 1
          done
          docker exec frontend-auth-e2e-postgres psql -U disposable_user -d disposable_db -c "SHOW ssl;"

          mkdir -p /tmp/frontend-auth-e2e-certs
          docker cp frontend-auth-e2e-postgres:/var/lib/postgresql/data/server.crt /tmp/frontend-auth-e2e-certs/server.crt

      - name: Apply schema + plan catalog migrations (real migration:run, same runtime as production)
        working-directory: backend
        env:
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
        run: |
          npm run build:migrations-runtime
          npm run migration:run:compiled

      # Integração do backend contra o MESMO PostgreSQL descartável já
      # migrado (contas e convites, concorrência, auditoria, agenda...). Cada
      # arquivo usa marcadores próprios e não apaga dados dos outros; o
      # e-mail vai para uma caixa HTTP local criada pelo próprio teste.
      - name: Backend PostgreSQL integration tests (db-e2e)
        working-directory: backend
        env:
          DB_E2E_DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          IGNORE_DOTENV_FILE: "true"
        run: npm run test:db-e2e

      - name: Build backend (Nest)
        working-directory: backend
        run: npm run build

      # `NEXT_PUBLIC_*` é embutido em BUILD time pelo Next.js — precisa estar
      # presente aqui, não só quando o servidor sobe depois.
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
        run: npm run build

      - name: Install Playwright browser (chromium only)
        run: npx playwright install --with-deps chromium

      # Playwright sobe backend real (dist/main.js) e frontend real (next
      # start) via `webServer` (ver playwright.config.ts) — nunca substitui a
      # UI real nem o backend real por fixture/mocks; só o banco é
      # descartável.
      # `PORT` nunca aqui — cada processo (backend/frontend) recebe a sua
      # própria porta fixa via `env` de cada entrada `webServer` do
      # playwright.config.ts; um `PORT` neste nível vazaria para os dois
      # processos e faria ambos tentarem escutar a mesma porta.
      - name: Run real browser flows (closed public signup + login/session/logout)
        id: browser_auth
        env:
          # Mesmo endereço de escuta da hospedagem (render.yaml): esta
          # invocação prova login/sessão/logout com o backend em 0.0.0.0. As
          # demais seguem no padrão (todas as interfaces).
          HOST: "0.0.0.0"
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          # Subdiretório próprio: a invocação seguinte limpa o
          # próprio outputDir, nunca o trace desta (ver playwright.config.ts).
          PLAYWRIGHT_OUTPUT_DIR: test-results/auth
        run: npm run test:browser:auth

      # Invocação SEPARADA do Playwright (Lote 6D.1), no MESMO Postgres
      # descartável — nada de infraestrutura duplicada. Separada por um motivo
      # concreto: o rate limit de POST /auth/register é de 5 por 15 min por IP
      # com store em memória do processo do backend, e as duas suítes juntas
      # passariam disso. Como `reuseExistingServer` é falso sob CI, esta
      # invocação sobe um backend novo, com o limiter zerado.
      - name: Run real browser flows (services management, cross-tenant attacks on the API)
        id: browser_services
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          # Subdiretório próprio: a invocação seguinte limpa o
          # próprio outputDir, nunca o trace desta (ver playwright.config.ts).
          PLAYWRIGHT_OUTPUT_DIR: test-results/services
        run: npm run test:browser:services

      # Invocação SEPARADA do Playwright (Lote 6D.2), mesmo motivo da suíte de
      # serviços: orçamento de POST /auth/register por IP, backend novo com
      # limiter zerado a cada invocação sob CI.
      - name: Run real browser flows (professionals management, cross-tenant attacks on the API)
        id: browser_professionals
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          # Subdiretório próprio: a invocação seguinte limpa o
          # próprio outputDir, nunca o trace desta (ver playwright.config.ts).
          PLAYWRIGHT_OUTPUT_DIR: test-results/professionals
        run: npm run test:browser:professionals

      # Invocação SEPARADA do Playwright (Lote 6D.3), mesmo motivo das
      # anteriores: orçamento de POST /auth/register por IP.
      - name: Run real browser flows (weekly working hours, cross-tenant attacks on the API)
        id: browser_working_hours
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          # Subdiretório próprio: a invocação seguinte limpa o
          # próprio outputDir, nunca o trace desta (ver playwright.config.ts).
          PLAYWRIGHT_OUTPUT_DIR: test-results/working-hours
        run: npm run test:browser:working-hours

      # Invocação SEPARADA do Playwright (Lote 6D.4), mesmo motivo das
      # anteriores: orçamento de POST /auth/register por IP.
      - name: Run real browser flows (availability consultation, cross-tenant attacks on the API)
        id: browser_availability
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          # Subdiretório próprio: a invocação seguinte limpa o
          # próprio outputDir, nunca o trace desta (ver playwright.config.ts).
          PLAYWRIGHT_OUTPUT_DIR: test-results/availability
        run: npm run test:browser:availability

      # Invocação SEPARADA do Playwright (Lote 6D.5), mesmo motivo das
      # anteriores: orçamento de POST /auth/register por IP.
      - name: Run real browser flows (appointment creation, conflict recovery, cross-tenant attacks on the API)
        id: browser_appointments
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          # Subdiretório próprio: a invocação seguinte limpa o
          # próprio outputDir, nunca o trace desta (ver playwright.config.ts).
          PLAYWRIGHT_OUTPUT_DIR: test-results/appointments
        run: npm run test:browser:appointments

      - name: Run real platform administration (authorization, pagination, detail, mobile)
        id: browser_administracao
        env:
          NODE_ENV: development
          IGNORE_DOTENV_FILE: "true"
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/administracao
        run: npm run test:browser:administracao

      # Invocação SEPARADA (aceite de convite: limite de 10 por 15 min por IP,
      # em memória no backend): empresa criada pela tela, e-mail na caixa
      # LOCAL (tests/browser/support/caixa-de-email.mjs, nada sai da
      # máquina), ativação, conta existente, revogação, falha de envio,
      # bloqueio com sessão aberta, permissões negadas e capturas.
      - name: Run real account management (invites, activation, block, permissions)
        id: browser_contas
        env:
          NODE_ENV: development
          IGNORE_DOTENV_FILE: "true"
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/contas
        run: npm run test:browser:contas

      # Invocação SEPARADA (1 aceite de convite e 1 login, limite por IP):
      # Equipe e acessos — acesso criado pela tela com login e senha (sem
      # convite), convite antigo ainda válido, agenda só do próprio
      # profissional, páginas e API do dono recusadas, permissões e suspensão
      # com a sessão aberta, situação e plano do estabelecimento pela
      # administração; capturas em claro e escuro, 1280, 390 e 360 px.
      - name: Run real team access flows (create access, legacy invite, own agenda, permissions, plan seats)
        id: browser_equipe
        env:
          NODE_ENV: development
          IGNORE_DOTENV_FILE: "true"
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/equipe
        run: npm run test:browser:equipe

      # Invocação SEPARADA (1 aceite de convite e 4 logins, limite por IP):
      # acesso de funcionário com nome de usuário e a senha definida pelo
      # dono, sem e-mail — criação pela tela (senha, confirmação,
      # mostrar/ocultar), entrada sem troca obrigatória, nome de usuário
      # único, nova senha do dono encerrando as sessões e invalidando a
      # anterior, troca voluntária no Perfil; capturas em claro e escuro,
      # 1280, 390 e 360 px.
      - name: Run real staff login flows (username and owner-defined password)
        id: browser_acesso_usuario
        env:
          NODE_ENV: development
          IGNORE_DOTENV_FILE: "true"
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/acesso-usuario
        run: npm run test:browser:acesso-usuario

      # Invocação SEPARADA (1 login, limite por IP): gerente criado pelo dono
      # com login em formato de e-mail e sem profissional; só as áreas
      # concedidas (tela, URL e API), sem telefone nem preço na agenda,
      # solicitação confirmada, retirada valendo na requisição seguinte;
      # capturas em claro e escuro, 1280, 390 e 360 px.
      - name: Run real manager access flows (owner-granted areas, internal login)
        id: browser_gerente
        env:
          NODE_ENV: development
          IGNORE_DOTENV_FILE: "true"
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/gerente
        run: npm run test:browser:gerente

      # Invocação SEPARADA (1 aceite de convite e 2 logins): calendário
      # individual do funcionário — dois profissionais com reservas no mesmo
      # dia, cada um só com os próprios em Mês, Semana e Dia (eventos,
      # contagens, "mais" e detalhe), computador e celular, e pelas chamadas
      # diretas à API; link público do estabelecimento sem profissional.
      - name: Run real staff calendar isolation flows (month, week, day)
        id: browser_calendario_funcionario
        env:
          NODE_ENV: development
          IGNORE_DOTENV_FILE: "true"
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/calendario-funcionario
        run: npm run test:browser:calendario-funcionario

      # Invocação SEPARADA (1 aceite de convite): recebimentos manuais — o
      # Início mostra só o que foi registrado, quitação com clique duplo
      # virando um registro, preço do serviço mudando sem alterar o
      # registrado, estorno com motivo e senha, funcionário sem acesso ao
      # dinheiro; capturas em claro e escuro, 1280, 390 e 360 px.
      - name: Run real manual payments flows (record, refund, dashboard money)
        id: browser_recebimentos
        env:
          NODE_ENV: development
          IGNORE_DOTENV_FILE: "true"
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/recebimentos
        run: npm run test:browser:recebimentos

      # Invocação SEPARADA (4 cadastros e 3 logins, limites reais por IP): tela
      # de Clientes — busca e seus estados, cadastro sem envio repetido,
      # duplicidade, resultado incerto, cliente no seletor da agenda,
      # isolamento atacado na API, 403 real, navegação no celular e buscas
      # concorrentes no seletor de cliente da agenda.
      - name: Run real browser flows (clients search, registration, isolation, mobile navigation)
        id: browser_clients
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/clients
        run: npm run test:browser:clients

      # Invocação SEPARADA (1 cadastro, 1 login): atalhos de WhatsApp na
      # agenda e em Clientes — link wa.me, texto codificado no fuso do
      # estabelecimento e nenhuma escrita na API ao abrir. O wa.me é
      # interceptado no navegador do teste: nenhuma mensagem real.
      - name: Run real browser flows (WhatsApp contact links, no side effects)
        id: browser_whatsapp
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/whatsapp
        run: npm run test:browser:whatsapp

      # Invocação SEPARADA (1 cadastro, 1 login, 8 pedidos públicos — limite de
      # 10 por hora por IP): agendamento público real por slug, ativação pelo
      # dono, pedido sempre PENDING, contador e aviso persistentes no painel,
      # confirmar/recusar com tela desatualizada, disputa de horário, resposta
      # perdida com "Verificar envio" e falha de comunicação, no celular e no
      # computador. wa.me interceptado: nenhuma mensagem real.
      - name: Run real browser flows (public booking by slug, pending requests in the owner panel)
        id: browser_agendamento_publico
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/agendamento-publico
        run: npm run test:browser:agendamento-publico

      # Invocação SEPARADA (2 cadastros, 1 login, 8 pedidos públicos — limite de
      # 10 por hora por IP): avisos de NOVAS solicitações dentro da área /conta —
      # chegam em outra página sem recarregar, nunca repetem, pausam com a
      # página oculta ou sem conexão, "Ver solicitação" não grava nada, som
      # opcional (bloqueado, o aviso continua), troca de estabelecimento e
      # saída encerram as consultas; computador e celular. O segundo vínculo
      # é gravado no PostgreSQL descartável (só loopback).
      - name: Run real browser flows (in-app alerts for new booking requests)
        id: browser_avisos_solicitacoes
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/avisos-solicitacoes
        run: npm run test:browser:avisos-solicitacoes

      # Invocação SEPARADA (1 cadastro, 1 login, 2 pedidos públicos): abertura
      # com a hospedagem gratuita acordando. Só o "servidor dormindo" é
      # simulado (502 da borda, requisição pendurada, offline); o relógio da
      # página é o do Playwright. Prova recuperação, prazo total, erros reais
      # (403/429/500) sem repetição e nenhuma escrita reenviada sozinha.
      - name: Run real browser flows (recovery while the free host wakes up)
        id: browser_recuperacao
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/recuperacao
        run: npm run test:browser:recuperacao

      # Invocação SEPARADA (2 cadastros, 2 logins, 2 pedidos públicos): Web
      # Push — PWA (manifesto, ícones, /sw.js sem cache), permissão só no
      # clique, estados ativado/desativado/bloqueado/não suportado/iPhone,
      # inscrição presa a usuário+estabelecimento+sessão, abrir a solicitação
      # pela URL da notificação (troca de estabelecimento, login preservando o
      # destino, vínculo removido) e sair desligando. O PushManager do
      # Chromium é SIMULADO e nenhum serviço de push é chamado (o teste
      # confere que não houve tentativa de envio). As chaves VAPID são
      # geradas aqui, só para este processo: nenhum secret do GitHub.
      - name: Run real browser flows (Web Push subscription, PWA, notification destination)
        id: browser_push
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/push
        run: |
          eval "$(node backend/scripts/generate-vapid-keys.mjs | sed 's/^/export /')"
          npm run test:browser:push

      # Invocação SEPARADA (1 cadastro, 1 login, nenhum pedido público):
      # serviço criado depois da ativação só vai ao público com profissional
      # ativo vinculado; a tela de Serviços diz o que falta; inativo,
      # desligado do online ou só com profissional inativo ficam fora; etapa
      # Profissional com vários, um e nenhum profissional.
      - name: Run real browser flows (public services eligibility, professional step)
        id: browser_servicos_publicos
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
