      # horário agora". Roda pela playwright.relogio-de-teste.config.ts, como
      # a Visão geral abaixo.
      - name: Run real browser flows (agenda day view, filter, states, new-appointment panel)
        id: browser_agenda_view
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
