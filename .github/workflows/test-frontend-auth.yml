            test-results/aparencia/**/menu-conta-*.png
            test-results/aparencia/**/login-*.png
          if-no-files-found: error
          retention-days: 7

      # Capturas do aviso "não aparece no agendamento online" na tela de
      # Serviços (claro e escuro, 360/390/1280 px). Só os PNG `servicos-aviso-*`.
      - name: Upload public services eligibility screenshots
        if: always() && steps.browser_servicos_publicos.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: servicos-publicos-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/servicos-publicos/**/servicos-aviso-*.png
          if-no-files-found: error
          retention-days: 7

      # Capturas da administração: desktop e celular, só dados descartáveis.
      - name: Upload platform administration screenshots
        if: always() && steps.browser_administracao.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: administracao-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/administracao/**/administracao-*.png
          retention-days: 7
          if-no-files-found: error

      - name: Upload account management screenshots
        if: always() && steps.browser_contas.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contas-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/contas/**/contas-*.png
          retention-days: 7
          if-no-files-found: error

      # Capturas de Equipe e acessos, da agenda do funcionário e da ficha na
      # administração. Só os PNG `equipe-*`.
      - name: Upload team access screenshots
        if: always() && steps.browser_equipe.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: equipe-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/equipe/**/equipe-*.png
          retention-days: 7
          if-no-files-found: error

      - name: Upload staff login screenshots
        if: always() && steps.browser_acesso_usuario.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acesso-usuario-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/acesso-usuario/**/usuario-*.png
          retention-days: 7
          if-no-files-found: error

      - name: Upload manager access screenshots
        if: always() && steps.browser_gerente.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gerente-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/gerente/**/gerente-*.png
          retention-days: 7
          if-no-files-found: error

      - name: Upload staff calendar screenshots
        if: always() && steps.browser_calendario_funcionario.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calendario-funcionario-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/calendario-funcionario/**/calendario-*.png
          retention-days: 7
          if-no-files-found: error

      - name: Upload manual payments screenshots
        if: always() && steps.browser_recebimentos.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recebimentos-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/recebimentos/**/recebimentos-*.png
          retention-days: 7
          if-no-files-found: error

      # Capturas da tela de Clientes no celular (390 e 360 px). Só os PNG
      # `clientes-*`.
      - name: Upload clients screenshots
        if: always() && steps.browser_clients.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clientes-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/clients/**/clientes-*.png
          if-no-files-found: error
          retention-days: 7

      # Capturas da agenda real em cada estado (vários atendimentos, vazio,
      # carregando, erro, painel aberto, reserva criada e em andamento), no
      # computador e no celular. Só os PNG `agenda-*`.
      - name: Upload agenda view screenshots
        if: always() && steps.browser_agenda_view.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agenda-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/agenda-view/**/agenda-*.png
          if-no-files-found: error
          retention-days: 7

      # Capturas da agenda "Por profissional" com vários profissionais e com a
      # lista incompleta, no computador e no celular. Só os PNG
      # `agenda-profissional-*`.
      - name: Upload agenda by professional screenshots
        if: always() && steps.browser_agenda_profissional.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agenda-por-profissional-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/agenda-profissional/**/agenda-profissional-*.png
          if-no-files-found: error
          retention-days: 7

      # Capturas da área real reorganizada (Visão geral, Agenda, Serviços e
      # Profissionais), no computador e no celular. Só os PNG `conta-*`.
      - name: Upload account area screenshots
        if: always() && steps.browser_visao_geral.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conta-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/visao-geral/**/conta-*.png
          if-no-files-found: error
          retention-days: 7

      # Integração do backend contra o MESMO Postgres descartável: prova o
      # comportamento real das consultas com escopo de tenant e das
      # constraints (nenhum fake em memória cobre isso). `DB_E2E_DIRECT_URL` é
      # o que liga esta suíte — sem ela, os testes se marcam como skip.
      - name: Backend integration against the disposable PostgreSQL (tenant-scoped queries, real constraints)
        working-directory: backend
        env:
          DB_E2E_DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
        run: npm run test:db-e2e

      # Diagnóstico de falha de navegador: `trace: "retain-on-failure"` grava
      # `trace.zip` (mais screenshot e o error-context) em `test-results/<invocação>/`.
      # `playwright-report/` NÃO é enviado porque nada o gera: o reporter é
      # `list` (ver playwright.config.ts) — o upload anterior apontava para
      # essa pasta inexistente e concluía "success" com zero arquivo, que foi
      # exatamente como o trace de uma falha real se perdeu.
      #
      # Condicionado ao fracasso de uma das invocações do Playwright, não a
      # `failure()` genérico: assim uma falha de lint (que não produz trace
      # nenhum) não dispara uma coleta vazia, e `if-no-files-found: error`
      # pode distinguir ausência INESPERADA de arquivo de ausência normal.
      #
      # Só `test-results/` entra — traces, screenshots e contexto de erro dos
      # testes descartáveis. Nunca `.env`, dados do banco ou o certificado
      # TLS do container.
      - name: Upload Playwright traces on browser-flow failure
        if: >-
          always() && (
            steps.browser_auth.outcome == 'failure' ||
            steps.browser_services.outcome == 'failure' ||
            steps.browser_professionals.outcome == 'failure' ||
            steps.browser_working_hours.outcome == 'failure' ||
            steps.browser_availability.outcome == 'failure' ||
            steps.browser_appointments.outcome == 'failure' ||
            steps.browser_clients.outcome == 'failure' ||
            steps.browser_administracao.outcome == 'failure' ||
            steps.browser_contas.outcome == 'failure' ||
            steps.browser_equipe.outcome == 'failure' ||
            steps.browser_acesso_usuario.outcome == 'failure' ||
            steps.browser_gerente.outcome == 'failure' ||
            steps.browser_calendario_funcionario.outcome == 'failure' ||
            steps.browser_whatsapp.outcome == 'failure' ||
            steps.browser_agendamento_publico.outcome == 'failure' ||
            steps.browser_avisos_solicitacoes.outcome == 'failure' ||
            steps.browser_push.outcome == 'failure' ||
            steps.browser_agenda_view.outcome == 'failure' ||
            steps.browser_agenda_profissional.outcome == 'failure' ||
            steps.browser_visao_geral.outcome == 'failure' ||
            steps.browser_proxy.outcome == 'failure'
          )
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # `run_attempt` no nome: um "Re-run failed jobs" não colide com o
          # artefato da tentativa anterior nem o sobrescreve.
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7

      - name: git diff --check (sem conflito/whitespace residual)
        run: git diff --check

      - name: Remove disposable PostgreSQL container
        if: always()
        run: docker rm -f frontend-auth-e2e-postgres || true
