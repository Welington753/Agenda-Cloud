      # Invocação SEPARADA (2 cadastros e 3 logins, limites reais de 5 por IP):
      # Visão geral (indicadores e listas da agenda real de hoje, estados de
      # carregamento, falha, lista incompleta e sem permissão), estrutura comum
      # da área real, troca de estabelecimento e `next` seguro. O segundo
      # vínculo e a permissão negada são gravados no PostgreSQL descartável
      # (`DATABASE_URL` abaixo); o teste recusa qualquer host fora do loopback.
      # Roda pela playwright.relogio-de-teste.config.ts: backend e navegador com o
      # relógio de teste (10:00 de hoje no fuso do estabelecimento), para o
      # caso não depender da hora real em que o job roda.
      - name: Run real browser flows (overview, shared account layout, tenant switch, safe next)
        id: browser_visao_geral
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          FRONTEND_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/visao-geral
        run: npm run test:browser:visao-geral

      # Modo do PILOTO (mesma origem): o frontend é recompilado com
      # `NEXT_PUBLIC_API_URL=/agenda_api`, e o navegador passa a falar só com
      # ele. Fica DEPOIS das suítes acima porque substitui o build anterior
      # (chamada direta à porta 3001), que elas usam.
      - name: Build frontend (same-origin proxy mode)
        env:
          NEXT_PUBLIC_API_URL: "/agenda_api"
        run: npm run build

      # HTTPS isolado (ver playwright.proxy.config.ts): borda TLS local com
      # certificado autoassinado gerado na hora, Next.js com o proxy
      # `/agenda_api` e a API em `NODE_ENV=production` (cookie `Secure`).
      # `API_PROXY_SECRET` é um valor fixo e descartável, só deste job;
      # nunca um secret do GitHub. Backend novo (limiter zerado), mesmo
      # Postgres descartável.
      - name: Run real browser flows (same-origin proxy over isolated HTTPS, production cookie, forged IP headers)
        id: browser_proxy
        env:
          DATABASE_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          DIRECT_URL: "postgresql://disposable_user:disposable_pass@127.0.0.1:55433/disposable_db"
          NODE_EXTRA_CA_CERTS: /tmp/frontend-auth-e2e-certs/server.crt
          API_PROXY_SECRET: "segredo-descartavel-do-ci-somente-para-teste-0123456789"
          CI: "true"
          PLAYWRIGHT_OUTPUT_DIR: test-results/proxy
        run: npm run test:browser:proxy

      # Evidência visual do destaque do horário escolhido (criação e
      # remarcação, computador e celular): as imagens que o próprio teste
      # gravou depois de conferir o estilo computado. Só os PNG `destaque-*`,
      # nunca outro arquivo de `test-results/`.
      - name: Upload selected-slot highlight screenshots
        if: always() && steps.browser_appointments.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: destaque-horario-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/appointments/**/destaque-*.png
          if-no-files-found: error
          retention-days: 7

      # Capturas do agendamento público e da tela de Solicitações (celular e
      # computador). Só os PNG `publico-*` e `solicitacoes-*`.
      - name: Upload public booking screenshots
        if: always() && steps.browser_agendamento_publico.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agendamento-publico-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/agendamento-publico/**/publico-*.png
            test-results/agendamento-publico/**/solicitacoes-*.png
          if-no-files-found: error
          retention-days: 7

      # Capturas dos avisos de novas solicitações (computador e celular). Só os
      # PNG `avisos-*`.
      - name: Upload new-request alert screenshots
        if: always() && steps.browser_avisos_solicitacoes.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avisos-solicitacoes-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/avisos-solicitacoes/**/avisos-*.png
          if-no-files-found: error
          retention-days: 7

      # Capturas do Web Push no celular (Android ativado e instruções do
      # iPhone). Só os PNG `push-*`.
      - name: Upload Web Push screenshots
        if: always() && steps.browser_push.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-push-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/push/**/push-*.png
          if-no-files-found: error
          retention-days: 7

      # Capturas da aparência (agendamento público e menu da conta, claro e
      # escuro, 360/390/1280 px). Só os PNG `aparencia-*`, `menu-conta-*` e
      # `login-*`.
      - name: Upload appearance screenshots
        if: always() && steps.browser_aparencia.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aparencia-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
